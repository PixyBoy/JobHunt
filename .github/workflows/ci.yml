name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@11.22.0

      - name: Generate lockfile for foundation migration
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm lockfile"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Shellcheck
        run: shellcheck scripts/*.sh .docker/entrypoint.sh

      - name: Bootstrap
        run: pnpm bootstrap

      - name: Start infrastructure
        run: pnpm infra:up

      - name: Run foundation CI
        run: pnpm ci

      - name: Stop infrastructure
        if: always()
        run: docker compose --env-file config/env/.env.development.example -f infra/docker/docker-compose.yml down
